<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- Pixel "A" — panel navy ground, brand magenta letter -->
    <rect width="32" height="32" rx="7" fill="#1a1a2e"/>
    <g fill="#ff00ff" shape-rendering="crispEdges">
        <!-- apex -->
        <rect x="12" y="0" width="8" height="4"/>
        <!-- upper diagonals -->
        <rect x="8" y="4" width="4" height="8"/>
        <rect x="20" y="4" width="4" height="8"/>
        <!-- outer legs -->
        <rect x="4" y="12" width="4" height="4"/>
        <rect x="24" y="12" width="4" height="4"/>
        <!-- crossbar -->
        <rect x="4" y="16" width="24" height="4"/>
        <!-- lower legs -->
        <rect x="4" y="20" width="4" height="8"/>
        <rect x="24" y="20" width="4" height="8"/>
    </g>
</svg>
