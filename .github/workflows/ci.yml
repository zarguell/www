name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: |
          python -m pip install -r requirements.txt
          npm ci

      - name: Lint Python
        working-directory: src
        run: ruff check .

      - name: Type-check TypeScript
        working-directory: src
        run: npm run typecheck

      - name: Python tests
        working-directory: src
        run: python -m pytest -q

      - name: JavaScript tests
        working-directory: src
        run: npm run test

      - name: Build site
        working-directory: src
        run: npm run build

      - name: Verify emitted routes
        working-directory: src
        run: |
          test -f dist/index.html
          test -f dist/blog/index.html
          test -f dist/about/index.html
          test -f dist/links/index.html
          test -f dist/tools/index.html
          test -f dist/404.html
          test -f dist/rss.xml
          test -f dist/sitemap.xml
          find dist -name '*.html' | wc -l

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: src/dist/
          retention-days: 7
