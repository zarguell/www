name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: |
          cd src
          npm ci

      - name: Run tests
        run: |
          cd src
          npm run test:run

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: src/coverage/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: |
          cd src
          npm ci

      - name: Build site
        run: |
          cd src
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: src/dist/
          retention-days: 7

      - name: Check build size
        run: |
          cd src/dist
          TOTAL_SIZE=$(du -sh . | cut -f1)
          echo "Total build size: $TOTAL_SIZE"
          # Alert if build is too large (> 10MB)
          SIZE_BYTES=$(du -sb . | cut -f1)
          if [ $SIZE_BYTES -gt 10485760 ]; then
            echo "::warning::Build size is larger than 10MB"
          fi

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: |
          cd src
          npm ci

      - name: Check TypeScript types
        run: |
          cd src
          npx tsc --noEmit || echo "TypeScript check complete"

      - name: Check for console.log in production code
        run: |
          cd src/src
          # Check for console.log excluding test files
          if grep -r "console\.log" --include="*.ts" --include="*.tsx" --include="*.astro" --exclude-dir="__tests__" .; then
            echo "::warning::Found console.log in production code"
          fi
